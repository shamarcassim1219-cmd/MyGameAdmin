name: mygame_admin
description: MYGame Marketplace Admin Panel
publish_to: 'none'
version: 1.3.9+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  background_downloader: 9.5.4
  open_filex: ^4.5.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  shared_preferences: ^2.2.2
  intl: '>=0.19.0 <0.21.0'
  image_picker: ^1.0.4
  google_fonts: ^6.1.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/logo.png
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
